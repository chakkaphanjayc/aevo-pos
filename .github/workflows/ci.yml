name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aevo_test
          POSTGRES_USER: aevo
          POSTGRES_PASSWORD: aevo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aevo -d aevo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aevo:aevo@localhost:5432/aevo_test
      DATABASE_URL: postgres://aevo:aevo@localhost:5432/aevo_test
      WEB_ORIGIN: http://localhost:4321
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
