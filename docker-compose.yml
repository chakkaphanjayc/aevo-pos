services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aevo
      POSTGRES_USER: aevo
      POSTGRES_PASSWORD: aevo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevo -d aevo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aevo_postgres:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aevo_test
      POSTGRES_USER: aevo
      POSTGRES_PASSWORD: aevo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevo -d aevo_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aevo_postgres:
